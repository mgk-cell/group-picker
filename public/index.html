<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ഗ്രൂപ്പ് തിരഞ്ഞെടുപ്പ് (Group Picker)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fdfbf7; margin: 0; padding: 20px; text-align: center; color: #2c3e50; }
        h1 { color: #8e44ad; font-size: 26px; margin-bottom: 5px; }
        p.subtitle { color: #555; font-size: 16px; margin-bottom: 20px; }
        #setup-container { background: #fff; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 2px solid #f39c12; }
        input[type="text"] { width: 85%; padding: 14px; font-size: 18px; border: 2px solid #ccc; border-radius: 8px; margin-bottom: 12px; text-align: center; }
        button { background: #27ae60; color: white; border: none; padding: 14px 24px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219653; }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 480px; margin: 0 auto; }
        .box { background: #fff9c4; border: 3px solid #f39c12; border-radius: 12px; padding: 24px 0; font-size: 24px; font-weight: bold; cursor: pointer; color: #d35400; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.08); }
        .box:hover:not(.taken) { background: #fff59d; transform: scale(1.03); }
        .box.taken { background: #34495e; border: 3px solid #2c3e50; color: #ecf0f1; cursor: not-allowed; box-shadow: none; opacity: 0.85; }

        #result-modal { display: none; margin-top: 20px; background: #fff; padding: 25px; border-radius: 12px; max-width: 400px; margin-left: auto; margin-right: auto; box-shadow: 0 6px 15px rgba(0,0,0,0.2); border: 3px solid #8e44ad; }
        .team-name { font-size: 38px; font-weight: bold; margin: 15px 0; color: #c0392b; }
    </style>
</head>
<body>

    <h1>ഗ്രൂപ്പ് തിരഞ്ഞെടുപ്പ്</h1>
    <p class="subtitle">നിങ്ങളുടെ പേര് നൽകി ഒരു പെട്ടി തിരഞ്ഞെടുക്കുക</p>

    <div id="setup-container">
        <div id="name-box">
            <input type="text" id="username" placeholder="നിങ്ങളുടെ പൂർണ്ണ നാമം (Full Name)" autocomplete="off">
            <br>
            <button onclick="saveName()">തുടരുക (Continue)</button>
        </div>
        <div id="welcome-msg" style="display:none; font-weight:bold; color: #27ae60; font-size: 18px;">
             സ്വാഗതം, <span id="display-name"></span>!<br>താഴെ ഒരു പെട്ടി തിരഞ്ഞെടുക്കുക.
        </div>
    </div>

    <div class="grid" id="box-grid"></div>

    <div id="result-modal">
        <h3>നിങ്ങൾക്ക് ലഭിച്ച ഗ്രൂപ്പ്:</h3>
        <div class="team-name" id="assigned-word"></div>
        <p style="font-size: 16px; color: #555;">ഈ വിവരം രേഖപ്പെടുത്തിക്കഴിഞ്ഞു.</p>
    </div>

<script>
    let myName = localStorage.getItem('picker_username') || '';

    window.onload = function() {
        loadState();
    };

    function saveName() {
        const input = document.getElementById('username').value.trim();
        if (!input) {
            alert('ദയവായി നിങ്ങളുടെ പേര് നൽകുക (Please enter your name)');
            return;
        }
        myName = input;
        localStorage.setItem('picker_username', myName);
        localStorage.removeItem('picker_done');
        document.getElementById('name-box').style.display = 'none';
        document.getElementById('welcome-msg').style.display = 'block';
        document.getElementById('display-name').innerText = myName;
        loadState();
    }

    async function loadState() {
        try {
            const res = await fetch('/state');
            const data = await res.json();
            
            let lastVersion = localStorage.getItem('picker_reset_version');
            if (!lastVersion) {
                localStorage.setItem('picker_reset_version', data.resetVersion);
                lastVersion = String(data.resetVersion);
            }

            if (lastVersion !== String(data.resetVersion)) {
                localStorage.clear();
                localStorage.setItem('picker_reset_version', data.resetVersion);
                location.reload();
                return;
            }

            if (myName && localStorage.getItem('picker_username')) {
                document.getElementById('name-box').style.display = 'none';
                document.getElementById('welcome-msg').style.display = 'block';
                document.getElementById('display-name').innerText = myName;
            }

            renderGrid(data.taken);
        } catch (e) {
            console.error('Error loading state:', e);
        }
    }

    function renderGrid(takenArray) {
        const grid = document.getElementById('box-grid');
        grid.innerHTML = '';
        
        const userHasPicked = localStorage.getItem('picker_done');

        for (let i = 0; i < 24; i++) {
            const box = document.createElement('div');
            box.className = 'box';

            if (takenArray[i]) {
                box.classList.add('taken');
                box.innerHTML = `<span style="font-size: 14px; display:block; color:#95a5a6;">എടുത്തു</span><strong>#${i+1}</strong><br><span style="font-size: 12px; color:#e74c3c;">Locked</span>`;
            } else if (userHasPicked) {
                box.classList.add('taken');
                box.innerText = i + 1;
            } else {
                box.innerText = i + 1;
                box.onclick = () => pickBox(i);
            }
            grid.appendChild(box);
        }
    }

    async function pickBox(index) {
        myName = localStorage.getItem('picker_username');
        if (!myName) {
            alert('ദയവായി ആദ്യം മുകളിൽ നിങ്ങളുടെ പേര് നൽകുക!');
            document.getElementById('username').focus();
            return;
        }

        if (localStorage.getItem('picker_done')) {
            alert('നിങ്ങൾ ഇതിനകം ഒരു പെട്ടി തിരഞ്ഞെടുത്തിട്ടുണ്ട്!');
            return;
        }

        if (!confirm(`പെട്ടി നമ്പർ ${index + 1} തിരഞ്ഞെടുക്കണമെന്ന് ഉറപ്പാണോ?`)) return;

        try {
            const res = await fetch('/pick', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ index: index, name: myName })
            });
            const data = await res.json();

            if (data.ok) {
                localStorage.setItem('picker_done', 'true');
                document.getElementById('box-grid').style.display = 'none';
                document.getElementById('result-modal').style.display = 'block';
                document.getElementById('assigned-word').innerText = data.word;
            } else {
                alert(data.error === 'taken' ? 'ഈ പെട്ടി മറ്റൊരാൾ എടുത്തു കഴിഞ്ഞു!' : 'തെറ്റ് സംഭവിച്ചു. വീണ്ടും ശ്രമിക്കുക.');
                loadState();
            }
        } catch (e) {
            alert('കണക്ഷൻ തകരാർ. വീണ്ടും ശ്രമിക്കുക.');
        }
    }
</script>

</body>
</html>
